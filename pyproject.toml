[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "irina-agent"
version = "0.1.0"
description = "Irina coding harness and SWE-bench GRPO research pipeline"
requires-python = ">=3.11"
dependencies = []
[project.optional-dependencies]
train = ["torch>=2.3", "transformers>=4.45,<5", "peft>=0.12", "datasets>=3,<5", "accelerate>=1"]
realistic = ["swebench>=2.0"]
dev = ["pytest>=8", "ruff>=0.6"]
[project.scripts]
irina = "irina.cli:main"
irina-grpo = "irina.rl.cli:main"
[tool.hatch.build.targets.wheel]
packages = ["src/irina"]
[tool.pytest.ini_options]
testpaths = ["tests"]
